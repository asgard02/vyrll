<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lab sous-titres</title>
  <style>
    :root {
      --bg: #0c0c0e;
      --panel: #16161a;
      --border: #2a2a30;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #beff00;
      --danger: #f43f5e;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    }
    body {
      display: grid;
      grid-template-columns: minmax(260px, 320px) 1fr;
      min-height: 100%;
    }
    aside {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 1.25rem 1.1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      overflow-y: auto;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin: 0 0 0.4rem;
      line-height: 1.15;
    }
    h1 span { color: var(--accent); }
    .eyebrow {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 0.55rem;
    }
    .lab-nav {
      display: flex;
      gap: 0.35rem;
      margin: 0 0 0.85rem;
    }
    .lab-nav a {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-decoration: none;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.28rem 0.65rem;
    }
    .lab-nav a.on {
      color: #111;
      background: var(--accent);
      border-color: transparent;
    }
    .sample {
      font-size: 0.88rem;
      line-height: 1.45;
      color: var(--muted);
      margin: 0;
    }
    label {
      display: block;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    select, button {
      width: 100%;
      font: inherit;
      font-size: 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #1c1c22;
      color: var(--text);
      padding: 0.55rem 0.7rem;
      cursor: pointer;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .chips button {
      width: auto;
      padding: 0.4rem 0.7rem;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .chips button.on {
      background: var(--accent);
      color: #111;
      border-color: transparent;
    }
    .group-label {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0.55rem 0 0.3rem;
    }
    select:focus, button:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    button.primary {
      background: var(--accent);
      color: #111;
      border-color: transparent;
      font-weight: 700;
    }
    button.primary:disabled {
      opacity: 0.5;
      cursor: wait;
    }
    .row {
      display: flex;
      gap: 0.5rem;
    }
    .row button { flex: 1; }
    .note {
      font-size: 0.78rem;
      line-height: 1.45;
      color: var(--muted);
      margin: 0;
    }
    .status {
      font-size: 0.78rem;
      color: var(--muted);
      min-height: 1.2em;
      margin: 0;
    }
    .status.err { color: var(--danger); }
    main {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background:
        radial-gradient(ellipse 60% 40% at 50% 20%, #1a1a22 0%, transparent 70%),
        var(--bg);
    }
    .phone {
      position: relative;
      width: min(360px, calc(100vw - 360px), calc((100vh - 3rem) * 9 / 16));
      aspect-ratio: 9 / 16;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
      background: #18181b;
    }
    .phone img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #18181b;
    }
    .hint {
      position: absolute;
      top: 0.65rem;
      left: 0.65rem;
      right: 0.65rem;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      pointer-events: none;
      text-align: center;
    }
    @media (max-width: 720px) {
      body { grid-template-columns: 1fr; }
      aside { border-right: none; border-bottom: 1px solid var(--border); }
      .phone { width: min(320px, 88vw); }
    }
  </style>
</head>
<body>
  <aside>
    <div>
      <p class="eyebrow">Lab local · Pillow</p>
      <nav class="lab-nav">
        <a class="on" href="/">Sous-titres</a>
        <a href="/titles">Titres · 3s</a>
      </nav>
      <h1>Sous-titres <span>reset</span></h1>
      <p class="sample" id="sampleText">Chargement…</p>
    </div>

    <div>
      <label>Style</label>
      <div class="chips" id="newStyles"></div>
      <p class="group-label" id="legacyLabel" hidden>Actuels — à valider</p>
      <div class="chips" id="legacyStyles"></div>
    </div>

    <p class="note" id="styleNote"></p>

    <div class="row">
      <button type="button" id="playPause">Pause</button>
      <button type="button" id="restart">↺ Début</button>
    </div>

    <button type="button" class="primary" id="reload">Recharger le moteur</button>
    <p class="status" id="status">localhost · rendu Pillow réel</p>
  </aside>

  <main>
    <div class="phone">
      <div class="hint">9:16 · lab</div>
      <img
        id="frame"
        alt="Aperçu sous-titres"
        width="540"
        height="960"
        src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
      />
    </div>
  </main>

  <script>
    const newStylesEl = document.getElementById("newStyles");
    const legacyStylesEl = document.getElementById("legacyStyles");
    const legacyLabelEl = document.getElementById("legacyLabel");
    const frameEl = document.getElementById("frame");
    const sampleEl = document.getElementById("sampleText");
    const noteEl = document.getElementById("styleNote");
    const statusEl = document.getElementById("status");
    const playPauseEl = document.getElementById("playPause");
    const restartEl = document.getElementById("restart");
    const reloadEl = document.getElementById("reload");

    const NOTES = {
      bubble: "Capsule claire, texte noir, phrase en minuscules.",
      bold: "Sans gras, minuscules, blanc + contour noir.",
      editorial: "Tout blanc ; un mot du cartouche (fixe) en serif italique, presque à la même hauteur.",
      serif: "Serif classique, blanc, casse phrase.",
      impact: "Mot actif or, 2 mots, contour épais.",
      neon: "Glow cyan — à retravailler.",
    };

    let meta = null;
    let currentStyle = "bubble";
    let t = 0;
    let playing = true;
    let lastTs = null;
    let lastPaintTs = 0;
    let holdFrames = 0;
    const FRAME_MS = 90;

    function setStatus(msg, isErr = false) {
      statusEl.textContent = msg;
      statusEl.classList.toggle("err", isErr);
    }

    function quantizeT(value) {
      const step = (meta && meta.t_step) || 0.08;
      return Math.round(value / step) * step;
    }

    function frameUrl(style, time) {
      const epoch = (meta && meta.cache_epoch) || 0;
      return `/frame.jpg?style=${encodeURIComponent(style)}&t=${quantizeT(time).toFixed(2)}&e=${epoch}`;
    }

    function paintChips() {
      const labels = (meta && meta.labels) || {};
      const fill = (el, keys) => {
        el.innerHTML = "";
        for (const s of keys) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.dataset.style = s;
          btn.textContent = labels[s] || s;
          if (s === currentStyle) btn.classList.add("on");
          btn.addEventListener("click", () => setStyle(s));
          btn.addEventListener("mouseenter", () => {
            const img = new Image();
            img.src = frameUrl(s, 0);
          });
          el.appendChild(btn);
        }
      };
      fill(newStylesEl, (meta && meta.new_styles) || []);
      const legacy = (meta && meta.legacy_styles) || [];
      fill(legacyStylesEl, legacy);
      if (legacyLabelEl) legacyLabelEl.hidden = legacy.length === 0;
    }

    function applyMeta(m) {
      meta = m;
      sampleEl.textContent = m.sample_text;
      const known = (m.styles || []);
      if (!known.includes(currentStyle)) currentStyle = (m.new_styles && m.new_styles[0]) || "bubble";
      noteEl.textContent = NOTES[currentStyle] || "";
      paintChips();
    }

    function setStyle(style) {
      if (!style) return;
      currentStyle = style;
      t = 0;
      lastTs = null;
      holdFrames = 18;
      noteEl.textContent = NOTES[style] || "";
      paintChips();
      requestFrame(true);
    }

    async function fetchMeta() {
      const res = await fetch("/api/meta", { cache: "no-store" });
      if (!res.ok) throw new Error("meta " + res.status);
      applyMeta(await res.json());
    }

    function requestFrame(force) {
      if (!meta) return;
      const style = currentStyle;
      const url = frameUrl(style, t);
      if (frameEl.getAttribute("data-url") === url && !force) return;
      frameEl.setAttribute("data-url", url);
      frameEl.src = url;
    }

    function tick(ts) {
      if (lastTs == null) lastTs = ts;
      const dt = (ts - lastTs) / 1000;
      lastTs = ts;
      if (playing && meta) {
        if (holdFrames > 0) {
          holdFrames -= 1;
          t = 0;
          lastPaintTs = ts;
          requestFrame(true);
        } else {
          const dur = Math.max(meta.duration || 1, 0.5);
          t += dt;
          if (t > dur + 0.35) t = 0;
          if (ts - lastPaintTs >= FRAME_MS) {
            lastPaintTs = ts;
            requestFrame(false);
          }
        }
      }
      requestAnimationFrame(tick);
    }

    playPauseEl.addEventListener("click", () => {
      playing = !playing;
      playPauseEl.textContent = playing ? "Pause" : "Play";
      lastTs = null;
    });

    restartEl.addEventListener("click", () => {
      t = 0;
      requestFrame(true);
    });

    reloadEl.addEventListener("click", async () => {
      reloadEl.disabled = true;
      setStatus("Rechargement de render_subtitles…");
      try {
        const res = await fetch("/api/reload", { method: "POST", cache: "no-store" });
        if (!res.ok) throw new Error("reload " + res.status);
        const data = await res.json();
        applyMeta(data.meta);
        requestFrame(true);
        setStatus("Moteur rechargé · " + new Date().toLocaleTimeString());
      } catch (e) {
        setStatus(String(e), true);
      } finally {
        reloadEl.disabled = false;
      }
    });

    (async () => {
      try {
        await fetchMeta();
        requestFrame(true);
        setStatus("localhost · Pillow");
        requestAnimationFrame(tick);
      } catch (e) {
        setStatus(String(e), true);
      }
    })();
  </script>
</body>
</html>
