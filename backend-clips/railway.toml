# Railway: Dockerfile (Node + Python) au lieu de Railpack
# Pro plan: healthcheck + restart — 1 replica, limites RAM/CPU via dashboard
# Replica limits : OOM à 8 Go / 8 vCPU plutôt que facture à 24/24
[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "node server.js"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
# Job worker polls Supabase — sleeping the replica pauses the queue until the
# next HTTP wake. Always-on; idle CPU is cheap vs a 1–2 min cold start.
sleepApplication = false

[deploy.limitOverride.containers]
cpu = 8
memoryBytes = 8000000000
