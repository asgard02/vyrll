# Railway: Dockerfile (Node + Python) au lieu de Railpack
# Pro plan: healthcheck + restart — 1 replica, limites RAM/CPU via dashboard
# Replica limits : OOM à 4 Go / 8 vCPU plutôt que facture à 24/24
[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "node server.js"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1

[deploy.limitOverride.containers]
cpu = 8
memoryBytes = 4000000000
