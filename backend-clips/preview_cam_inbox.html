<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Collecte screens — cam lab</title>
  <style>
    :root {
      --bg: #0c0c0e;
      --panel: #16161a;
      --border: #2a2a30;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #beff00;
      --danger: #f43f5e;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.4rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    h1 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: 0.02em;
    }
    h1 span { color: var(--accent); }
    .muted { color: var(--muted); font-size: 0.85rem; }
    .actions { display: flex; gap: 0.5rem; align-items: center; }
    button, a.btn {
      font: inherit;
      font-size: 0.88rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #1c1c22;
      color: var(--text);
      padding: 0.5rem 0.8rem;
      cursor: pointer;
      text-decoration: none;
    }
    button.primary, a.btn.primary {
      background: var(--accent);
      color: #111;
      border-color: transparent;
      font-weight: 700;
    }
    button.ghost { background: transparent; }
    button:focus, a.btn:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
    .board {
      flex: 1;
      padding: 1.4rem;
      outline: none;
    }
    .catch {
      border: 1.5px dashed var(--border);
      border-radius: 16px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      text-align: center;
      color: var(--muted);
      background: #111114;
      margin-bottom: 1.2rem;
      padding: 1.5rem;
    }
    body.armed .catch {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(190, 255, 0, 0.12);
    }
    .catch strong { color: var(--text); font-size: 1.35rem; }
    kbd {
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.12rem 0.45rem;
      color: var(--accent);
    }
    .status {
      min-height: 1.2em;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .status.ok { color: var(--accent); }
    .status.err { color: var(--danger); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 0.7rem;
    }
    .card {
      position: relative;
      display: block;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #111;
      text-decoration: none;
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card.fresh { outline: 2px solid var(--accent); }
    .card .tag {
      position: absolute;
      top: 6px;
      right: 6px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: var(--accent);
      color: #111;
      border-radius: 4px;
      padding: 0.12rem 0.35rem;
    }
    .ghost-input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      width: 0;
      height: 0;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Collecte <span>screens</span></h1>
      <p class="muted" id="count">0 screen · cette page ne sert qu’à coller</p>
    </div>
    <div class="actions">
      <button type="button" class="ghost" id="clearFocus">Rester prêt à coller</button>
      <a class="btn" href="/fx">Clip FX</a>
      <a class="btn primary" href="/lab">Ouvrir le lab →</a>
    </div>
  </header>

  <main class="board" id="board" tabindex="0">
    <div class="catch" id="catch">
      <strong>Colle un screen</strong>
      <span><kbd>⌘</kbd> <kbd>V</kbd> ou <kbd>Ctrl</kbd> <kbd>V</kbd> — autant que tu veux</span>
      <span>Pas besoin de cliquer ailleurs. Un screen = un collage.</span>
      <p class="status" id="status">fenêtre active · en attente</p>
    </div>
    <div class="grid" id="grid"></div>
  </main>
  <textarea class="ghost-input" id="catcher" autocomplete="off"></textarea>

  <script>
    const grid = document.getElementById("grid");
    const statusEl = document.getElementById("status");
    const countEl = document.getElementById("count");
    const catcher = document.getElementById("catcher");
    const board = document.getElementById("board");
    let images = [];
    let busy = false;

    function setStatus(msg, kind) {
      statusEl.textContent = msg;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    function armCatcher() {
      document.body.classList.add("armed");
      catcher.focus({ preventScroll: true });
    }

    function render() {
      const n = images.length;
      countEl.textContent = n + " screen" + (n > 1 ? "s" : "") + " · clique une vignette pour labelliser";
      grid.innerHTML = "";
      for (const img of images) {
        const a = document.createElement("a");
        a.className = "card" + (img.fresh ? " fresh" : "");
        a.href = "/lab?id=" + encodeURIComponent(img.id);
        const el = document.createElement("img");
        el.src = img.url + "?t=" + Date.now();
        el.alt = img.id;
        a.appendChild(el);
        if (img.labeled) {
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = "ok";
          a.appendChild(tag);
        }
        grid.appendChild(a);
      }
    }

    function imageFilesFrom(list) {
      return Array.from(list || []).filter((f) => f && f.type && f.type.startsWith("image/"));
    }

    async function ingestOne(file) {
      const data = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
      const res = await fetch("/api/upload", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data, name: file.name }),
      });
      const rec = await res.json();
      if (!res.ok) throw new Error(rec.error || "upload");
      rec.fresh = true;
      images = [rec, ...images.filter((x) => x.id !== rec.id)];
      return rec;
    }

    async function ingestFiles(fileList) {
      const files = imageFilesFrom(fileList);
      if (!files.length || busy) return;
      busy = true;
      try {
        setStatus("import de " + files.length + "…");
        let added = 0;
        for (const file of files) {
          await ingestOne(file);
          added += 1;
        }
        for (const img of images) {
          if (!img.just) continue;
        }
        render();
        setStatus(added + " collé" + (added > 1 ? "s" : "") + " · recommence Ctrl+V", "ok");
      } catch (e) {
        setStatus(String(e.message || e), "err");
      } finally {
        busy = false;
        catcher.value = "";
        armCatcher();
      }
    }

    function filesFromClipboard(cd) {
      if (!cd) return [];
      let files = imageFilesFrom(cd.files);
      if (!files.length && cd.items) {
        files = Array.from(cd.items)
          .filter((item) => item.type && item.type.startsWith("image/"))
          .map((item) => item.getAsFile())
          .filter(Boolean);
      }
      return files;
    }

    window.addEventListener("paste", async (ev) => {
      const files = filesFromClipboard(ev.clipboardData);
      if (!files.length) return;
      ev.preventDefault();
      await ingestFiles(files);
    });

    window.addEventListener("dragover", (ev) => { ev.preventDefault(); });
    window.addEventListener("drop", async (ev) => {
      ev.preventDefault();
      await ingestFiles(ev.dataTransfer && ev.dataTransfer.files);
    });

    window.addEventListener("focus", armCatcher);
    window.addEventListener("click", (ev) => {
      if (ev.target.closest("a, button")) return;
      armCatcher();
    });
    document.getElementById("clearFocus").addEventListener("click", (ev) => {
      ev.preventDefault();
      armCatcher();
      setStatus("prêt · Ctrl+V", "ok");
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) armCatcher();
    });

    (async () => {
      try {
        const res = await fetch("/api/meta", { cache: "no-store" });
        const meta = await res.json();
        images = meta.images || [];
        render();
        setStatus("fenêtre active · en attente");
      } catch (e) {
        setStatus(String(e.message || e), "err");
      }
      armCatcher();
    })();
  </script>
</body>
</html>
