<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clip FX — lab local</title>
  <style>
    :root {
      --bg: #0c0c0e;
      --panel: #16161a;
      --border: #2a2a30;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #beff00;
      --danger: #f43f5e;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    }
    body {
      display: grid;
      grid-template-columns: minmax(260px, 300px) 1fr;
      min-height: 100%;
    }
    aside {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 1.15rem 1.05rem 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
    }
    h1 {
      font-size: 1.28rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin: 0 0 0.35rem;
      line-height: 1.15;
    }
    h1 span { color: var(--accent); }
    .eyebrow {
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 0.45rem;
    }
    .eyebrow a { color: inherit; text-decoration: none; }
    .sample {
      font-size: 0.84rem;
      line-height: 1.45;
      color: var(--muted);
      margin: 0;
    }
    label, .k {
      display: block;
      font-size: 0.66rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.32rem;
    }
    select, button {
      width: 100%;
      font: inherit;
      font-size: 0.88rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #1c1c22;
      color: var(--text);
      padding: 0.52rem 0.7rem;
      cursor: pointer;
    }
    select:focus, button:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    button.primary {
      background: var(--accent);
      color: #111;
      border-color: transparent;
      font-weight: 700;
    }
    button.primary:disabled { opacity: 0.5; cursor: wait; }
    .row { display: flex; gap: 0.45rem; }
    .row button { flex: 1; }
    .toggles {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .toggles button[aria-pressed="true"] {
      background: var(--accent);
      color: #111;
      border-color: transparent;
      font-weight: 700;
    }
    .status {
      font-size: 0.76rem;
      color: var(--muted);
      min-height: 1.2em;
      margin: 0;
    }
    .status.err { color: var(--danger); }
    main {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.4rem;
      background:
        radial-gradient(ellipse 60% 40% at 50% 20%, #1a1a22 0%, transparent 70%),
        var(--bg);
    }
    .phone {
      position: relative;
      width: min(360px, calc(100vw - 340px), calc((100vh - 3rem) * 9 / 16));
      aspect-ratio: 9 / 16;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
      background: #18181b;
    }
    .phone img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hint {
      position: absolute;
      top: 0.6rem;
      left: 0.6rem;
      right: 0.6rem;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      pointer-events: none;
      text-align: center;
    }
    @media (max-width: 720px) {
      body { grid-template-columns: 1fr; }
      aside { border-right: none; border-bottom: 1px solid var(--border); }
      .phone { width: min(320px, 88vw); }
    }
  </style>
</head>
<body>
  <aside>
    <div>
      <p class="eyebrow"><a href="/">Collecte</a> · <a href="/lab">Cam</a> · clip</p>
      <h1>Clip <span>FX</span></h1>
      <p class="sample">Même 9:16 que le lab cam, plus les sous-titres et le flash d’intro. Rien n’est poussé en prod.</p>
    </div>

    <div>
      <label for="screen">Screen (lab cam)</label>
      <select id="screen"></select>
    </div>

    <div>
      <label for="sfx">Son du flash</label>
      <select id="sfx"></select>
    </div>

    <div>
      <label for="style">Sous-titres</label>
      <select id="style"></select>
    </div>

    <div>
      <span class="k">Calques</span>
      <div class="toggles">
        <button type="button" id="togFlash" aria-pressed="true">Flash intro</button>
        <button type="button" id="togShut" aria-pressed="true">Son du flash</button>
        <button type="button" id="togSubs" aria-pressed="true">Sous-titres</button>
      </div>
    </div>

    <div class="row">
      <button type="button" id="playPause">Pause</button>
      <button type="button" id="restart">↺ Début</button>
    </div>

    <button type="button" class="primary" id="reload">Recharger le moteur</button>
    <p class="status" id="status">localhost · preview seulement</p>
  </aside>

  <main>
    <div class="phone">
      <div class="hint">9:16 · lab</div>
      <img
        id="frame"
        alt="Aperçu clip"
        width="540"
        height="960"
        src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
      />
    </div>
  </main>

  <script>
    const screenEl = document.getElementById("screen");
    const sfxEl = document.getElementById("sfx");
    const styleEl = document.getElementById("style");
    const frameEl = document.getElementById("frame");
    const statusEl = document.getElementById("status");
    const playPauseEl = document.getElementById("playPause");
    const restartEl = document.getElementById("restart");
    const reloadEl = document.getElementById("reload");
    const togFlash = document.getElementById("togFlash");
    const togShut = document.getElementById("togShut");
    const togSubs = document.getElementById("togSubs");

    let meta = null;
    let t = 0;
    let playing = true;
    let lastTs = null;
    let inflight = false;
    let pending = false;
    let shutter = null;
    let firedShutter = false;

    function pressed(btn) {
      return btn.getAttribute("aria-pressed") === "true";
    }
    function toggle(btn) {
      btn.setAttribute("aria-pressed", pressed(btn) ? "false" : "true");
    }
    function setStatus(msg, isErr = false) {
      statusEl.textContent = msg;
      statusEl.classList.toggle("err", isErr);
    }

    function applyMeta(m) {
      meta = m;
      const prevScreen = screenEl.value;
      const prevStyle = styleEl.value;
      screenEl.innerHTML = "";
      for (const img of m.images || []) {
        const opt = document.createElement("option");
        opt.value = img.id;
        opt.textContent = img.id + (img.labeled ? " · labellisé" : "");
        screenEl.appendChild(opt);
      }
      if ([...screenEl.options].some((o) => o.value === prevScreen)) screenEl.value = prevScreen;
      else if (m.default_id) screenEl.value = m.default_id;

      const prevSfx = sfxEl.value;
      sfxEl.innerHTML = "";
      for (const s of m.sfx || []) {
        const opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = s.label;
        sfxEl.appendChild(opt);
      }
      if ([...sfxEl.options].some((o) => o.value === prevSfx)) sfxEl.value = prevSfx;
      else sfxEl.value = m.sfx_default || "flash";
      loadShutter();

      styleEl.innerHTML = "";
      for (const s of m.styles || []) {
        const opt = document.createElement("option");
        opt.value = s;
        opt.textContent = s;
        styleEl.appendChild(opt);
      }
      if ((m.styles || []).includes(prevStyle)) styleEl.value = prevStyle;
      else styleEl.value = (m.styles && m.styles[0]) || "impact";
    }

    async function fetchMeta() {
      const res = await fetch("/api/fx/meta", { cache: "no-store" });
      if (!res.ok) throw new Error("meta " + res.status);
      applyMeta(await res.json());
    }

    function loadShutter() {
      const id = sfxEl.value || "flash";
      shutter = new Audio("/api/fx/shutter.wav?id=" + encodeURIComponent(id) + "&v=flash-pop");
      shutter.preload = "auto";
      shutter.volume = 0.5;
    }

    function playShutter() {
      if (!pressed(togShut) || !shutter) return;
      try {
        shutter.currentTime = 0;
        const p = shutter.play();
        if (p && p.catch) p.catch(() => {});
      } catch (_e) {}
    }

    function requestFrame() {
      if (!meta) return;
      if (inflight) {
        pending = true;
        return;
      }
      const id = screenEl.value;
      if (!id) return;
      const url =
        `/api/fx/frame.png?id=${encodeURIComponent(id)}` +
        `&style=${encodeURIComponent(styleEl.value)}` +
        `&t=${t.toFixed(3)}` +
        `&flash=${pressed(togFlash) ? "1" : "0"}` +
        `&subs=${pressed(togSubs) ? "1" : "0"}` +
        `&_=${Date.now()}`;
      inflight = true;
      const img = new Image();
      img.onload = () => {
        frameEl.src = url;
        inflight = false;
        if (pending) {
          pending = false;
          requestFrame();
        }
      };
      img.onerror = async () => {
        inflight = false;
        try {
          const res = await fetch(url, { cache: "no-store" });
          const text = await res.text();
          setStatus(text.slice(0, 220) || ("Erreur frame " + res.status), true);
        } catch (e) {
          setStatus(String(e), true);
        }
        if (pending) {
          pending = false;
          requestFrame();
        }
      };
      img.src = url;
    }

    function tick(ts) {
      if (lastTs == null) lastTs = ts;
      const dt = (ts - lastTs) / 1000;
      lastTs = ts;
      if (playing && meta) {
        const dur = Math.max(meta.duration || 1, 1.2);
        const prev = t;
        t += dt;
        if (t > dur + 0.25) {
          t = 0;
          firedShutter = false;
        }
        if (!firedShutter && t < 0.08) {
          firedShutter = true;
          playShutter();
        }
        if (prev > 0.2 && t < 0.08) playShutter();
        requestFrame();
      }
      requestAnimationFrame(tick);
    }

    togFlash.addEventListener("click", () => { toggle(togFlash); requestFrame(); });
    togShut.addEventListener("click", () => { toggle(togShut); });
    togSubs.addEventListener("click", () => { toggle(togSubs); requestFrame(); });
    screenEl.addEventListener("change", () => { t = 0; firedShutter = false; requestFrame(); playShutter(); });
    sfxEl.addEventListener("change", () => {
      loadShutter();
      t = 0;
      firedShutter = false;
      playShutter();
    });
    styleEl.addEventListener("change", requestFrame);

    playPauseEl.addEventListener("click", () => {
      playing = !playing;
      playPauseEl.textContent = playing ? "Pause" : "Play";
      lastTs = null;
      if (playing && t < 0.08) playShutter();
    });

    restartEl.addEventListener("click", () => {
      t = 0;
      firedShutter = false;
      playShutter();
      requestFrame();
    });

    reloadEl.addEventListener("click", async () => {
      reloadEl.disabled = true;
      setStatus("Rechargement…");
      try {
        const res = await fetch("/api/reload", { method: "POST", cache: "no-store" });
        if (!res.ok) throw new Error("reload " + res.status);
        await fetchMeta();
        t = 0;
        firedShutter = false;
        requestFrame();
        setStatus("Moteur rechargé · " + new Date().toLocaleTimeString());
      } catch (e) {
        setStatus(String(e), true);
      } finally {
        reloadEl.disabled = false;
      }
    });

    (async () => {
      try {
        await fetchMeta();
        requestFrame();
        setStatus("localhost · pop du flash, pas de clic shutter");
        requestAnimationFrame(tick);
      } catch (e) {
        setStatus(String(e), true);
      }
    })();
  </script>
</body>
</html>
