<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trimoai — chargement</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
    }
    body {
      display: grid;
      place-items: center;
    }
    .stage {
      position: relative;
      width: min(52vw, 460px);
      aspect-ratio: 512 / 501;
    }
    .piece {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      animation: var(--anim) 1.7s linear infinite;
    }
    .tl { transform-origin: 16.8% 17.4%; --anim: tl; }
    .tr { transform-origin: 82.4% 17.4%; --anim: tr; }
    .br { transform-origin: 82.2% 82.8%; --anim: br; }
    .bl { transform-origin: 16.8% 82.6%; --anim: bl; }
    .c  { transform-origin: 49.2% 50.3%; --anim: c; }

    @keyframes tl {
      0%, 2%   { transform: translate(-48%, -48%) scale(0.25) rotate(-32deg); opacity: 0; filter: brightness(1); }
      14%      { transform: translate(3%, 3%) scale(1.14) rotate(8deg); opacity: 1; filter: brightness(1.7); }
      20%      { transform: none; opacity: 1; filter: brightness(1); }
      64%      { transform: none; opacity: 1; filter: brightness(1); }
      80%, 100%{ transform: translate(-48%, -48%) scale(0.25) rotate(-32deg); opacity: 0; filter: brightness(1); }
    }
    @keyframes tr {
      0%, 12%  { transform: translate(48%, -48%) scale(0.25) rotate(32deg); opacity: 0; filter: brightness(1); }
      24%      { transform: translate(-3%, 3%) scale(1.14) rotate(-8deg); opacity: 1; filter: brightness(1.7); }
      30%      { transform: none; opacity: 1; filter: brightness(1); }
      64%      { transform: none; opacity: 1; filter: brightness(1); }
      80%, 100%{ transform: translate(48%, -48%) scale(0.25) rotate(32deg); opacity: 0; filter: brightness(1); }
    }
    @keyframes br {
      0%, 22%  { transform: translate(48%, 48%) scale(0.25) rotate(-32deg); opacity: 0; filter: brightness(1); }
      34%      { transform: translate(-3%, -3%) scale(1.14) rotate(8deg); opacity: 1; filter: brightness(1.7); }
      40%      { transform: none; opacity: 1; filter: brightness(1); }
      64%      { transform: none; opacity: 1; filter: brightness(1); }
      80%, 100%{ transform: translate(48%, 48%) scale(0.25) rotate(-32deg); opacity: 0; filter: brightness(1); }
    }
    @keyframes bl {
      0%, 32%  { transform: translate(-48%, 48%) scale(0.25) rotate(32deg); opacity: 0; filter: brightness(1); }
      44%      { transform: translate(3%, -3%) scale(1.14) rotate(-8deg); opacity: 1; filter: brightness(1.7); }
      50%      { transform: none; opacity: 1; filter: brightness(1); }
      64%      { transform: none; opacity: 1; filter: brightness(1); }
      80%, 100%{ transform: translate(-48%, 48%) scale(0.25) rotate(32deg); opacity: 0; filter: brightness(1); }
    }
    @keyframes c {
      0%, 42%  { transform: scale(0); opacity: 0; filter: brightness(1); }
      50%      { transform: scale(1.28); opacity: 1; filter: brightness(2); }
      56%      { transform: scale(0.94); opacity: 1; filter: brightness(1.15); }
      60%      { transform: scale(1); opacity: 1; filter: brightness(1); }
      64%      { transform: scale(1); opacity: 1; filter: brightness(1); }
      72%      { transform: scale(1.16); opacity: 1; filter: brightness(1.5); }
      80%, 100%{ transform: scale(0); opacity: 0; filter: brightness(1); }
    }
  </style>
</head>
<body>
  <div class="stage" role="img" aria-label="Trimoai, chargement">
    <img class="piece tl" src="tl.png" alt="" />
    <img class="piece tr" src="tr.png" alt="" />
    <img class="piece br" src="br.png" alt="" />
    <img class="piece bl" src="bl.png" alt="" />
    <img class="piece c" src="c.png" alt="" />
  </div>
</body>
</html>
